# Strict CI — every gate must pass; no continue-on-error.
name: Strict CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Warnings as errors; demote known legacy noise only (do not silence the warning).
  CI_CXXFLAGS: >-
    -std=c++17 -O2 -g -Wall -Wextra -Werror
    -Wno-error=sign-compare -Wno-error=format -Wno-error=narrowing
    -Wno-unused-parameter -pthread

jobs:
  compile:
    name: Compile (-Werror)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make

      - name: make bins
        run: |
          set -euo pipefail
          make -j"$(nproc)" CXXFLAGS="${CI_CXXFLAGS}" bins

      - name: Required fixtures
        run: |
          set -euo pipefail
          test -f bench/probe/storm.cpp
          test -f tests/golden/small.img
          test -f tests/golden/v1/small.img

  smoke:
    name: Smoke (g16–g18 / h2 / f1)
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make

      - name: make ci-smoke
        run: |
          set -euo pipefail
          make -j"$(nproc)" CXXFLAGS="${CI_CXXFLAGS}" ci-smoke

  test:
    name: Full make test
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make

      - name: make test
        run: |
          set -euo pipefail
          make -j"$(nproc)" CXXFLAGS="${CI_CXXFLAGS}" test

  sanitizers:
    name: ASan + UBSan + TSan
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make

      - name: make asan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1:abort_on_error=1
        run: |
          set -euo pipefail
          mkdir -p build
          make asan

  ci-ok:
    name: Strict CI OK
    if: always()
    needs: [compile, smoke, test, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all gates success
        run: |
          set -euo pipefail
          echo "compile=${{ needs.compile.result }}"
          echo "smoke=${{ needs.smoke.result }}"
          echo "test=${{ needs.test.result }}"
          echo "sanitizers=${{ needs.sanitizers.result }}"
          test "${{ needs.compile.result }}" = "success"
          test "${{ needs.smoke.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.sanitizers.result }}" = "success"
